<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pennyworth</title>
    <link rel="icon" type="image/png" href="../../public/pennyworth.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="../../public/pennyworth.png" alt="Pennyworth logo" />
          <div>
            <h1>Pennyworth</h1>
            <p id="subTitle">Context loading...</p>
          </div>
        </div>
        <div class="runtime-meta no-drag">
          <span id="runtimePill" class="runtime-pill">Starting</span>
          <button id="settingsBtn" type="button" aria-label="Settings">
            <img class="settings-icon" src="../../public/settings.png" alt="" />
          </button>
          <button id="providerBadge" type="button" aria-label="Provider">
            <img id="providerBadgeIcon" class="provider-icon" src="../../public/ollama.png" alt="" />
          </button>
          <div class="window-controls">
            <button 
              id="windowCloseBtn" 
              class="window-dot window-dot-close" 
              type="button" 
              data-tooltip="Close" 
              aria-label="Close to tray"
              title="Close to tray">
              <span aria-hidden="true"></span>
            </button>
            <button 
              id="windowMinBtn" 
              class="window-dot window-dot-min" 
              type="button" 
              data-tooltip="Minimize" 
              aria-label="Minimize"
              title="Minimize">
              <span aria-hidden="true"></span>
            </button>
            <button
              id="windowMaxBtn"
              class="window-dot window-dot-max"
              type="button"
              data-tooltip="Fullscreen"
              title="Fullscreen"
              aria-label="Maximize or Restore"
            >
              <span aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </header>

      <section id="chat" class="chat"></section>
      <section id="tracePanel" class="trace-panel hidden">
        <div class="trace-header">Tool Trace (Dev Mode)</div>
        <pre id="traceContent">No tool calls captured yet.</pre>
      </section>

      <section class="composer">
        <div class="composer-actions">
          <select id="profileSelect" disabled title="Auto-detected profile"></select>
          <button id="captureBtn" type="button">Screen</button>
          <button id="voiceBtn" type="button">Voice</button>
        </div>

        <div id="capturePreview" class="capture-preview hidden">
          <img id="captureImage" alt="Captured context" />
          <span id="captureInfo">Screenshot attached</span>
          <button id="clearCaptureBtn" type="button" aria-label="Remove screenshot">Remove</button>
        </div>

        <textarea id="promptInput" placeholder="Ask a question or paste terminal output."></textarea>

        <div class="composer-footer">
          <div id="status">Ready.</div>
          <button id="sendBtn" type="button">Send</button>
        </div>
      </section>
    </main>

    <div id="loader" class="loader hidden">
      <div class="loader-bar"></div>
      <p>Working...</p>
    </div>

    <div id="cropModal" class="crop-modal hidden">
      <div class="crop-panel">
        <div class="modal-header">
          <div>
            <h2>Screen Capture</h2>
            <p id="cropSelectionMeta">Full screenshot</p>
          </div>
          <div id="displaySelectorWrap" class="display-selector hidden">
            <label for="displaySelect">Monitor</label>
            <select id="displaySelect"></select>
          </div>
        </div>
        <div id="cropCanvasWrap" class="crop-canvas-wrap"></div>
        <div class="crop-actions">
          <button id="resetCropBtn" type="button">Reset</button>
          <button id="cancelCropBtn" type="button">Cancel</button>
          <button id="confirmCropBtn" type="button">Use Full Screen</button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="settings-modal hidden">
      <div class="settings-panel">
        <h2>Settings</h2>
        <p>Provider, context, and runtime controls.</p>

        <section class="settings-section">
          <h3>System Context</h3>
          <div class="settings-grid">
            <label for="detectedProfile">Detected Distro Profile</label>
            <input id="detectedProfile" type="text" readonly />

            <label for="detectedArch">Detected Architecture</label>
            <input id="detectedArch" type="text" readonly />

            <label for="detectionReason">Detection Reason</label>
            <input id="detectionReason" type="text" readonly />

            <label for="docsRootOverride">Docs Root URL Override</label>
            <input
              id="docsRootOverride"
              type="text"
              placeholder="Leave blank to use profile default documentation URL"
            />

            <label for="allowIpLocation">Allow IP Location For Weather</label>
            <input id="allowIpLocation" type="checkbox" />

            <label for="devMode">Enable Developer Trace Panel</label>
            <input id="devMode" type="checkbox" />

            <label for="themeSelect">UI Theme</label>
            <select id="themeSelect">
              <option value="light">Light (Default)</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </section>

        <section class="settings-section llm-section">
          <h3>LLM Provider</h3>
          <div class="llm-tabs">
            <button id="llmTabOllama" class="llm-tab" type="button" data-provider="ollama">Ollama</button>
            <button id="llmTabGemini" class="llm-tab" type="button" data-provider="gemini">Gemini</button>
            <button id="llmTabOpenAI" class="llm-tab" type="button" data-provider="openai">OpenAI</button>
          </div>

          <div id="llmPanelOllama" class="llm-panel">
            <div class="provider-grid">
              <label for="ollamaBaseUrl">Ollama Base URL</label>
              <input id="ollamaBaseUrl" type="text" />

              <label for="ollamaModel">Ollama Model</label>
              <select id="ollamaModel"></select>
            </div>
          </div>

          <div id="llmPanelOpenAI" class="llm-panel hidden">
            <div class="provider-grid">
              <label for="openaiModel">OpenAI Model</label>
              <input id="openaiModel" type="text" />

              <label for="openaiApiKey">OpenAI API Key</label>
              <div class="api-key-wrap">
                <input id="openaiApiKey" type="password" placeholder="Leave empty to keep current key" />
                <button id="clearOpenAIBtn" class="clear-key-btn" type="button" aria-label="Clear OpenAI API key">
                  X
                </button>
              </div>
            </div>
          </div>

          <div id="llmPanelGemini" class="llm-panel hidden">
            <div class="provider-grid">
              <label for="geminiModel">Gemini Model</label>
              <input id="geminiModel" type="text" />

              <label for="geminiApiKey">Gemini API Key</label>
              <div class="api-key-wrap">
                <input id="geminiApiKey" type="password" placeholder="Leave empty to keep current key" />
                <button id="clearGeminiBtn" class="clear-key-btn" type="button" aria-label="Clear Gemini API key">
                  X
                </button>
              </div>
            </div>
          </div>
        </section>

        <div class="settings-key-status">
          <span id="ollamaStatus" class="badge"></span>
          <span id="openaiKeyStatus" class="badge"></span>
          <span id="geminiKeyStatus" class="badge"></span>
        </div>

        <div class="crop-actions">
          <button id="cancelSettingsBtn" type="button">Cancel</button>
          <button id="saveSettingsBtn" type="button">Save Settings</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
